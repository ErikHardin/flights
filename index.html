<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AFSS" />
  <title>Advanced Flight Seat Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface2: #e8eef5;
      --border: #d1dce8;
      --blue-primary: #3b82c4;
      --blue-light: #6aaee8;
      --blue-pale: #dbeafe;
      --blue-dark: #1e5a9c;
      --grey-text: #4a5568;
      --grey-light: #8899aa;
      --text: #1a2533;
      --green: #059669;
      --shadow: 0 2px 12px rgba(59,130,196,0.10);
      --radius: 14px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .app-title { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--blue-primary); }
    .quota-badge { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--grey-light); background: var(--surface2); padding: 3px 8px; border-radius: 20px; }

    /* Main */
    .main { padding: 16px 16px calc(40px + var(--safe-bottom)); max-width: 480px; margin: 0 auto; }

    /* Card */
    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
    .card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-light); margin-bottom: 10px; }

    /* Program grid */
    .program-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .prog-btn {
      background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 4px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
      color: var(--grey-text); cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3;
    }
    .prog-btn.active { background: var(--blue-pale); border-color: var(--blue-primary); color: var(--blue-dark); font-weight: 600; }
    .prog-btn:active { transform: scale(0.96); }

    /* Route inputs */
    .route-row { display: grid; grid-template-columns: 1fr 32px 1fr; align-items: center; gap: 8px; }
    .route-arrow { text-align: center; color: var(--blue-light); font-size: 18px; }
    .input-wrap label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--grey-light); margin-bottom: 4px; }
    .input-wrap input, .input-wrap select {
      width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 12px; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
      color: var(--text); text-transform: uppercase; outline: none; transition: border-color 0.15s; -webkit-appearance: none;
    }
    .input-wrap input:focus, .input-wrap select:focus { border-color: var(--blue-primary); background: var(--surface); }
    .input-wrap input::placeholder { color: var(--grey-light); text-transform: none; }

    /* Region grid */
    .region-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .region-btn {
      background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      color: var(--grey-text); cursor: pointer; transition: all 0.15s; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .region-btn.active { background: var(--blue-pale); border-color: var(--blue-primary); color: var(--blue-dark); font-weight: 600; }
    .region-btn:active { transform: scale(0.96); }

    /* Toggle row */
    .toggle-row { display: flex; gap: 7px; }
    .toggle-btn {
      flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 6px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      color: var(--grey-text); cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .toggle-btn.active { background: var(--blue-pale); border-color: var(--blue-primary); color: var(--blue-dark); font-weight: 600; }
    .toggle-btn:active { transform: scale(0.96); }

    /* Date row */
    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Mode tabs */
    .mode-tabs { display: flex; background: var(--surface2); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 14px; }
    .mode-tab {
      flex: 1; padding: 9px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      color: var(--grey-text); border: none; background: none; border-radius: 6px; cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .mode-tab.active { background: var(--surface); color: var(--blue-primary); font-weight: 600; box-shadow: var(--shadow); }

    /* Search button */
    .search-btn {
      width: 100%; background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
      color: white; border: none; border-radius: var(--radius); padding: 16px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
      letter-spacing: 0.04em; box-shadow: 0 4px 16px rgba(59,130,196,0.35); transition: all 0.15s; margin-bottom: 14px;
    }
    .search-btn:active { transform: scale(0.98); opacity: 0.9; }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Results header */
    .results-header {
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--grey-light); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .results-count { background: var(--blue-pale); color: var(--blue-dark); padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }

    /* Result card */
    .result-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); animation: fadeUp 0.2s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .result-route { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .result-airports { font-family: 'DM Mono', monospace; font-size: 19px; font-weight: 500; color: var(--text); letter-spacing: 0.04em; }
    .result-arrow { color: var(--blue-light); margin: 0 5px; }
    .result-date { font-size: 12px; color: var(--grey-light); font-weight: 500; margin-top: 2px; }
    .result-source-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--surface2); color: var(--grey-text); padding: 3px 8px; border-radius: 20px; white-space: nowrap;
    }

    /* Cabin rows - award */
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--grey-light); margin-bottom: 5px; margin-top: 8px;
    }
    .cabin-rows { display: flex; flex-direction: column; gap: 4px; }
    .cabin-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface2); border-radius: var(--radius-sm); padding: 7px 10px;
    }
    .cabin-row-left { display: flex; align-items: center; gap: 8px; }
    .cabin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cabin-dot.economy  { background: #0369a1; }
    .cabin-dot.premium  { background: #b45309; }
    .cabin-dot.business { background: #1d4ed8; }
    .cabin-dot.first    { background: #6d28d9; }
    .cabin-dot.pz { background: #059669; }
    .cabin-dot.pn { background: #0891b2; }
    .cabin-dot.rn { background: #7c3aed; }
    .cabin-name { font-size: 12px; font-weight: 600; color: var(--grey-text); }
    .cabin-seats { font-size: 11px; color: var(--grey-light); margin-left: 2px; }
    .cabin-row-right { display: flex; align-items: center; gap: 6px; }
    .cabin-points { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--blue-dark); }
    .direct-badge { font-size: 10px; font-weight: 600; background: #dcfce7; color: #16a34a; padding: 2px 6px; border-radius: 10px; }

    /* Upgrade section */
    .upgrade-section { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
    .upgrade-label { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--green); margin-bottom: 5px; }
    .upgrade-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-sm); padding: 7px 10px; margin-bottom: 4px;
    }
    .upgrade-badge {
      font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 700;
      color: var(--green); min-width: 28px;
    }
    .upgrade-desc { font-size: 11px; color: #374151; flex: 1; margin-left: 8px; }
    .upgrade-seats { font-size: 11px; font-weight: 600; color: var(--green); }

    /* Loading */
    .loading { text-align: center; padding: 40px 20px; color: var(--grey-light); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue-primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty / error */
    .empty-state { text-align: center; padding: 32px 20px; color: var(--grey-light); font-size: 14px; }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    /* Saved routes */
    .saved-route-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .saved-route-item:last-child { border-bottom: none; }
    .saved-route-airports { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--text); }
    .saved-route-detail { font-size: 11px; color: var(--grey-light); margin-top: 2px; }
    .saved-route-del { color: var(--grey-light); font-size: 18px; padding: 4px 8px; cursor: pointer; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">✈ Advanced Flight Seat Search</div>
    <div class="quota-badge" id="quotaBadge">— calls left</div>
  </div>
</div>

<div class="main">

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('route')" id="tab-route">Route</button>
    <button class="mode-tab" onclick="setMode('region')" id="tab-region">Region</button>
    <button class="mode-tab" onclick="setMode('saved')" id="tab-saved">Saved</button>
  </div>

  <!-- ── ROUTE SEARCH ── -->
  <div id="mode-route">
    <div class="card">
      <div class="card-label">Mileage Programs (select multiple)</div>
      <div class="program-grid" id="programGrid"></div>
    </div>

    <div class="card">
      <div class="card-label">Route</div>
      <div class="route-row">
        <div class="input-wrap">
          <label>From</label>
          <input type="text" id="origin" placeholder="CLE" maxlength="3" />
        </div>
        <div class="route-arrow">→</div>
        <div class="input-wrap">
          <label>To</label>
          <input type="text" id="destination" placeholder="LHR" maxlength="3" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Cabin</div>
      <div class="toggle-row" id="cabinToggle">
        <button class="toggle-btn" onclick="setCabin('')">Any</button>
        <button class="toggle-btn" onclick="setCabin('economy')">Eco</button>
        <button class="toggle-btn" onclick="setCabin('premium')">Prem</button>
        <button class="toggle-btn active" onclick="setCabin('business')">Biz</button>
        <button class="toggle-btn" onclick="setCabin('first')">First</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Date Range</div>
      <div class="date-row">
        <div class="input-wrap"><label>Start</label><input type="date" id="startDate" /></div>
        <div class="input-wrap"><label>End</label><input type="date" id="endDate" /></div>
      </div>
    </div>

    <button class="search-btn" onclick="runRouteSearch()" id="searchBtn">Search Availability</button>
  </div>

  <!-- ── REGION EXPLORE ── -->
  <div id="mode-region" style="display:none">
    <div class="card">
      <div class="card-label">Mileage Programs (select multiple)</div>
      <div class="program-grid" id="programGridRegion"></div>
    </div>

    <div class="card">
      <div class="card-label">Cabin</div>
      <div class="toggle-row" id="cabinToggleRegion">
        <button class="toggle-btn" onclick="setCabinRegion('')">Any</button>
        <button class="toggle-btn" onclick="setCabinRegion('economy')">Eco</button>
        <button class="toggle-btn" onclick="setCabinRegion('premium')">Prem</button>
        <button class="toggle-btn active" onclick="setCabinRegion('business')">Biz</button>
        <button class="toggle-btn" onclick="setCabinRegion('first')">First</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Origin Region <span style="font-weight:400;text-transform:none;font-size:10px;">(optional)</span></div>
      <div class="region-grid" id="originRegionGrid"></div>
    </div>

    <div class="card">
      <div class="card-label">Destination Region <span style="font-weight:400;text-transform:none;font-size:10px;">(optional)</span></div>
      <div class="region-grid" id="destRegionGrid"></div>
    </div>

    <div class="card">
      <div class="card-label">Date Range</div>
      <div class="date-row">
        <div class="input-wrap"><label>Start</label><input type="date" id="startDateRegion" /></div>
        <div class="input-wrap"><label>End</label><input type="date" id="endDateRegion" /></div>
      </div>
    </div>

    <button class="search-btn" onclick="runRegionSearch()" id="searchBtnRegion">Explore Region</button>
  </div>

  <!-- ── SAVED ── -->
  <div id="mode-saved" style="display:none">
    <div class="card">
      <div class="card-label">Saved Routes</div>
      <div id="savedList"></div>
    </div>
  </div>

  <!-- ── RESULTS ── -->
  <div id="resultsArea" style="display:none">
    <div class="results-header">
      <span>Results</span>
      <span class="results-count" id="resultsCount">0</span>
    </div>
    <div id="resultsList"></div>
  </div>

</div>

<script>
var WORKER = "https://seats-proxy.erikchardin.workers.dev";

// State
var selectedPrograms    = new Set(["united"]);
var selectedProgramsReg = new Set(["united"]);
var selectedCabin       = "business";
var selectedCabinRegion = "business";
var selectedOriginRegion = "";
var selectedDestRegion   = "";
var currentMode = "route";
var savedRoutes = JSON.parse(localStorage.getItem("afss_saved") || "[]");

var PROGRAMS = [
  { id: "united",         label: "United" },
  { id: "aeroplan",       label: "Aeroplan" },
  { id: "delta",          label: "Delta" },
  { id: "american",       label: "American" },
  { id: "alaska",         label: "Alaska" },
  { id: "flyingblue",     label: "Flying Blue" },
  { id: "singapore",      label: "Singapore" },
  { id: "turkish",        label: "Turkish" },
  { id: "virginatlantic", label: "Virgin Atl" },
  { id: "lufthansa",      label: "Lufthansa" },
  { id: "qantas",         label: "Qantas" },
  { id: "emirates",       label: "Emirates" },
  { id: "qatar",          label: "Qatar" },
  { id: "jetblue",        label: "JetBlue" },
  { id: "finnair",        label: "Finnair" },
  { id: "sas",            label: "SAS" },
];

var REGIONS = [
  { id: "North America", icon: "🌎" },
  { id: "South America", icon: "🌎" },
  { id: "Europe",        icon: "🌍" },
  { id: "Africa",        icon: "🌍" },
  { id: "Asia",          icon: "🌏" },
  { id: "Oceania",       icon: "🌏" },
];

// ── Init ──
function init() {
  buildGrid("programGrid", selectedPrograms, toggleRouteProgram);
  buildGrid("programGridRegion", selectedProgramsReg, toggleRegionProgram);
  buildRegionGrids();
  setDefaultDates();
  renderSaved();
}

function buildGrid(containerId, selSet, toggleFn) {
  var el = document.getElementById(containerId);
  el.innerHTML = PROGRAMS.map(function(p) {
    return '<button class="prog-btn ' + (selSet.has(p.id) ? "active" : "") + '" ' +
      'onclick="' + toggleFn.name + "('" + p.id + "', this)" + '">' + p.label + '</button>';
  }).join("");
}

function buildRegionGrids() {
  ["originRegionGrid","destRegionGrid"].forEach(function(id, idx) {
    var el = document.getElementById(id);
    var isOrigin = idx === 0;
    el.innerHTML = REGIONS.map(function(r) {
      var active = (isOrigin ? selectedOriginRegion : selectedDestRegion) === r.id;
      var fn = isOrigin ? "setOriginRegion" : "setDestRegion";
      return '<button class="region-btn ' + (active ? "active" : "") + '" ' +
        'onclick="' + fn + "('" + r.id + "', this)" + '">' + r.icon + " " + r.id + '</button>';
    }).join("");
  });
}

function setDefaultDates() {
  var today = new Date();
  var later = new Date(); later.setDate(today.getDate() + 90);
  var fmt = function(d) { return d.toISOString().split("T")[0]; };
  document.getElementById("startDate").value = fmt(today);
  document.getElementById("endDate").value   = fmt(later);
  document.getElementById("startDateRegion").value = fmt(today);
  document.getElementById("endDateRegion").value   = fmt(later);
}

// ── Mode ──
function setMode(mode) {
  currentMode = mode;
  ["route","region","saved"].forEach(function(m) {
    document.getElementById("mode-" + m).style.display = m === mode ? "block" : "none";
    document.getElementById("tab-" + m).classList.toggle("active", m === mode);
  });
  document.getElementById("resultsArea").style.display = "none";
  if (mode === "saved") renderSaved();
}

// ── Program toggles ──
function toggleRouteProgram(id, btn) {
  if (selectedPrograms.has(id)) {
    if (selectedPrograms.size === 1) return;
    selectedPrograms.delete(id); btn.classList.remove("active");
  } else {
    selectedPrograms.add(id); btn.classList.add("active");
  }
}
function toggleRegionProgram(id, btn) {
  if (selectedProgramsReg.has(id)) {
    if (selectedProgramsReg.size === 1) return;
    selectedProgramsReg.delete(id); btn.classList.remove("active");
  } else {
    selectedProgramsReg.add(id); btn.classList.add("active");
  }
}

// ── Cabin ──
function setCabin(cabin) {
  selectedCabin = cabin;
  var vals = ["","economy","premium","business","first"];
  document.querySelectorAll("#cabinToggle .toggle-btn").forEach(function(b, i) {
    b.classList.toggle("active", vals[i] === cabin);
  });
}
function setCabinRegion(cabin) {
  selectedCabinRegion = cabin;
  var vals = ["","economy","premium","business","first"];
  document.querySelectorAll("#cabinToggleRegion .toggle-btn").forEach(function(b, i) {
    b.classList.toggle("active", vals[i] === cabin);
  });
}

// ── Regions ──
function setOriginRegion(region, btn) {
  selectedOriginRegion = selectedOriginRegion === region ? "" : region;
  document.querySelectorAll("#originRegionGrid .region-btn").forEach(function(b) { b.classList.remove("active"); });
  if (selectedOriginRegion) btn.classList.add("active");
}
function setDestRegion(region, btn) {
  selectedDestRegion = selectedDestRegion === region ? "" : region;
  document.querySelectorAll("#destRegionGrid .region-btn").forEach(function(b) { b.classList.remove("active"); });
  if (selectedDestRegion) btn.classList.add("active");
}

// ── Route Search ──
async function runRouteSearch() {
  var origin = document.getElementById("origin").value.trim().toUpperCase();
  var dest   = document.getElementById("destination").value.trim().toUpperCase();
  if (!origin || !dest) { alert("Enter origin and destination airport codes."); return; }

  var startDate = document.getElementById("startDate").value;
  var endDate   = document.getElementById("endDate").value;
  var programs  = Array.from(selectedPrograms);

  setLoading(true, "searchBtn", "Search Availability");

  try {
    var allResults = [];
    for (var i = 0; i < programs.length; i++) {
      var params = new URLSearchParams({
        origin_airport: origin,
        destination_airport: dest,
        source: programs[i]
      });
      if (selectedCabin) params.set("cabin", selectedCabin);
      if (startDate)     params.set("start_date", startDate);
      if (endDate)       params.set("end_date", endDate);

      var res = await fetch(WORKER + "/search?" + params);
      updateQuota(res);
      if (res.ok) {
        var data = await res.json();
        if (data.data) allResults.push.apply(allResults, data.data);
      }
    }
    offerSave(origin, dest, programs, selectedCabin);
    renderResults(allResults);
  } catch(e) {
    showError("Request failed. Check your connection.");
  } finally {
    setLoading(false, "searchBtn", "Search Availability");
  }
}

// ── Region Search (multi-program) ──
async function runRegionSearch() {
  var startDate = document.getElementById("startDateRegion").value;
  var endDate   = document.getElementById("endDateRegion").value;
  var programs  = Array.from(selectedProgramsReg);

  setLoading(true, "searchBtnRegion", "Explore Region");

  try {
    var allResults = [];
    for (var i = 0; i < programs.length; i++) {
      var params = new URLSearchParams({ source: programs[i], take: "200" });
      if (selectedCabinRegion)  params.set("cabin", selectedCabinRegion);
      if (selectedOriginRegion) params.set("origin_region", selectedOriginRegion);
      if (selectedDestRegion)   params.set("destination_region", selectedDestRegion);
      if (startDate)            params.set("start_date", startDate);
      if (endDate)              params.set("end_date", endDate);

      var res = await fetch(WORKER + "/availability?" + params);
      updateQuota(res);
      if (res.ok) {
        var data = await res.json();
        var rows = data.availability || data.data || [];
        // Tag each row with source since bulk doesn't always include it
        rows.forEach(function(r) { if (!r.Source) r.Source = programs[i]; });
        allResults.push.apply(allResults, rows);
      }
    }
    renderResults(allResults);
  } catch(e) {
    showError("Request failed. Check your connection.");
  } finally {
    setLoading(false, "searchBtnRegion", "Explore Region");
  }
}

// ── Render Results ──
function renderResults(items) {
  var area = document.getElementById("resultsArea");
  var list = document.getElementById("resultsList");
  document.getElementById("resultsCount").textContent = items.length;

  if (!items.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div>No availability found.<br/>Try expanding dates or cabin class.</div>';
    area.style.display = "block";
    return;
  }

  // Sort by date
  items.sort(function(a, b) {
    var da = a.Date || a.DepartsAt || "";
    var db = b.Date || b.DepartsAt || "";
    return da < db ? -1 : da > db ? 1 : 0;
  });

  list.innerHTML = items.map(function(item, i) {
    return buildResultCard(item, i);
  }).join("");

  area.style.display = "block";
  area.scrollIntoView({ behavior: "smooth", block: "start" });
}

function buildResultCard(item, i) {
  // Route
  var origin = (item.Route && item.Route.OriginAirport) || item.OriginAirport || "—";
  var dest   = (item.Route && item.Route.DestinationAirport) || item.DestinationAirport || "—";

  // Date
  var rawDate = item.Date || item.DepartsAt || "";
  var dateStr = rawDate ? formatDate(rawDate) : "—";

  // Source
  var source = item.Source || "—";

  // ── Award cabin rows ──
  var awardCabins = [
    { key: "Y", label: "Economy",  cls: "economy"  },
    { key: "W", label: "Premium",  cls: "premium"  },
    { key: "J", label: "Business", cls: "business" },
    { key: "F", label: "First",    cls: "first"    },
  ];

  var awardRows = awardCabins.filter(function(c) {
    return item[c.key + "Available"] === true;
  }).map(function(c) {
    var pts    = item[c.key + "MileageCost"] || item[c.key + "MileageCostRaw"] || "";
    var seats  = item[c.key + "RemainingSeats"] || "";
    var direct = item[c.key + "Direct"] === true;
    var ptsStr = pts ? formatPoints(pts) : "";
    var seatStr = seats ? "(" + seats + " left)" : "";
    return '<div class="cabin-row">' +
      '<div class="cabin-row-left">' +
        '<div class="cabin-dot ' + c.cls + '"></div>' +
        '<span class="cabin-name">' + c.label + '</span>' +
        (seatStr ? '<span class="cabin-seats">' + seatStr + '</span>' : '') +
      '</div>' +
      '<div class="cabin-row-right">' +
        (direct ? '<span class="direct-badge">Nonstop</span>' : '') +
        (ptsStr ? '<span class="cabin-points">' + ptsStr + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join("");

  // ── Upgrade rows (United-specific: PZ, PN, RN) ──
  var upgradeDefs = [
    { key: "PZ", label: "PZ", desc: "PlusPoints / Mileage Upgrade (Plat, 1K)" },
    { key: "PN", label: "PN", desc: "Instant Upgrade (Global Services)" },
    { key: "RN", label: "RN", desc: "Premium Plus Upgrade (PlusPoints / MUA)" },
  ];

  var upgradeRows = upgradeDefs.filter(function(u) {
    return item[u.key + "Available"] === true;
  }).map(function(u) {
    var seats = item[u.key + "RemainingSeats"] || item[u.key + "Seats"] || "";
    var seatStr = seats ? seats + " open" : "";
    return '<div class="upgrade-row">' +
      '<span class="upgrade-badge">' + u.key + '</span>' +
      '<span class="upgrade-desc">' + u.desc + '</span>' +
      (seatStr ? '<span class="upgrade-seats">' + seatStr + '</span>' : '') +
    '</div>';
  }).join("");

  var upgradeSection = upgradeRows
    ? '<div class="upgrade-section"><div class="upgrade-label">⬆ Upgrade Space</div>' + upgradeRows + '</div>'
    : "";

  var hasAward = awardRows.length > 0;

  return '<div class="result-card" style="animation-delay:' + (i * 0.025) + 's">' +
    '<div class="result-route">' +
      '<div>' +
        '<div class="result-airports"><span>' + origin + '</span><span class="result-arrow">→</span><span>' + dest + '</span></div>' +
        '<div class="result-date">' + dateStr + '</div>' +
      '</div>' +
      '<div class="result-source-badge">' + source.toUpperCase() + '</div>' +
    '</div>' +
    (hasAward ? '<div class="section-label">Award</div><div class="cabin-rows">' + awardRows + '</div>' : '') +
    upgradeSection +
  '</div>';
}

// ── Helpers ──
function formatDate(str) {
  try {
    var d = new Date(str);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  } catch(e) { return str; }
}

function formatPoints(val) {
  var n = parseInt(val, 10);
  if (isNaN(n)) return val;
  return n.toLocaleString() + " pts";
}

function updateQuota(res) {
  var q = res.headers.get("x-ratelimit-remaining");
  if (q) document.getElementById("quotaBadge").textContent = q + " calls left";
}

function setLoading(on, btnId, offLabel) {
  var btn  = document.getElementById(btnId);
  var area = document.getElementById("resultsArea");
  if (on) {
    btn.disabled = true;
    btn.textContent = "Searching…";
    area.style.display = "block";
    document.getElementById("resultsList").innerHTML = '<div class="loading"><div class="spinner"></div>Fetching availability…</div>';
    document.getElementById("resultsCount").textContent = "…";
  } else {
    btn.disabled = false;
    btn.textContent = offLabel;
  }
}

function showError(msg) {
  document.getElementById("resultsList").innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>' + msg + '</div>';
  document.getElementById("resultsArea").style.display = "block";
}

// ── Saved routes ──
function offerSave(origin, dest, programs, cabin) {
  var key = origin + "-" + dest;
  var exists = savedRoutes.some(function(r) { return r.key === key; });
  if (exists) return;
  if (confirm("Save route " + origin + " → " + dest + "?")) {
    savedRoutes.push({ key: key, origin: origin, dest: dest, programs: programs, cabin: cabin });
    localStorage.setItem("afss_saved", JSON.stringify(savedRoutes));
  }
}

function renderSaved() {
  var el = document.getElementById("savedList");
  if (!savedRoutes.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔖</div>No saved routes yet.<br/>Search a route and tap Save.</div>';
    return;
  }
  el.innerHTML = savedRoutes.map(function(r, i) {
    return '<div class="saved-route-item" onclick="loadSaved(' + i + ')">' +
      '<div>' +
        '<div class="saved-route-airports">' + r.origin + ' → ' + r.dest + '</div>' +
        '<div class="saved-route-detail">' + r.programs.join(", ") + ' · ' + (r.cabin || "Any") + '</div>' +
      '</div>' +
      '<div class="saved-route-del" onclick="deleteSaved(event,' + i + ')">✕</div>' +
    '</div>';
  }).join("");
}

function loadSaved(i) {
  var r = savedRoutes[i];
  setMode("route");
  document.getElementById("origin").value = r.origin;
  document.getElementById("destination").value = r.dest;
  selectedPrograms = new Set(r.programs);
  selectedCabin = r.cabin || "business";
  buildGrid("programGrid", selectedPrograms, toggleRouteProgram);
  setCabin(selectedCabin);
  runRouteSearch();
}

function deleteSaved(e, i) {
  e.stopPropagation();
  savedRoutes.splice(i, 1);
  localStorage.setItem("afss_saved", JSON.stringify(savedRoutes));
  renderSaved();
}

// Auto-uppercase airport inputs
["origin","destination"].forEach(function(id) {
  document.getElementById(id).addEventListener("input", function() {
    this.value = this.value.toUpperCase();
  });
});

init();
</script>

</html>
