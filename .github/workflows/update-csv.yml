name: Update Upgrade CSV

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download PZ CSV from Seat Aero
        env:
          SEAT_AERO_SESSION: ${{ secrets.SEAT_AERO_SESSION }}
        run: ./.github/scripts/fetch-pnpz.sh PZ PNPZ_Data_PZ.csv

      # Extra upgrade classes are bonus columns in the Hub Scan view. Not every
      # account can pull every class, so a failure here must not cost us the PZ
      # refresh that just succeeded — each is attempted independently.
      - name: Download PN/RN/IN CSVs from Seat Aero
        continue-on-error: true
        env:
          SEAT_AERO_SESSION: ${{ secrets.SEAT_AERO_SESSION }}
        run: |
          for FC in PN RN IN; do
            ./.github/scripts/fetch-pnpz.sh "$FC" "PNPZ_Data_$FC.csv" || echo "$FC unavailable — skipping"
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for FC in PZ PN RN IN; do
            if [ -f "PNPZ_Data_$FC.csv" ]; then
              git add -- "PNPZ_Data_$FC.csv"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update PNPZ data $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            git push
          fi
