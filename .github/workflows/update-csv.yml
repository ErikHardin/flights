name: Update Upgrade CSV

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download CSV from Seat Aero
        env:
          SEAT_AERO_SESSION: ${{ secrets.SEAT_AERO_SESSION }}
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Cookie: __Host-session=${SEAT_AERO_SESSION}" \
            "https://seats.aero/_api/pnpz?fare_class=PZ&origin_region=Anywhere&destination_region=Anywhere&csv=true" \
            -o response.txt

          echo "--- HTTP status and first 500 chars of response ---"
          tail -1 response.txt
          head -c 500 response.txt

          HTTP_CODE=$(tail -1 response.txt | grep -o '[0-9]*$')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Request failed with HTTP $HTTP_CODE — see response above"
            exit 1
          fi

          cp response.txt PNPZ_Data_PZ.csv
          ROWS=$(wc -l < PNPZ_Data_PZ.csv)
          echo "Downloaded $ROWS rows"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PNPZ_Data_PZ.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update PNPZ data $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            git push
          fi
