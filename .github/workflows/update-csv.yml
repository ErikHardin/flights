name: Update Upgrade CSV

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download PZ CSV from Seat Aero
        env:
          SEAT_AERO_SESSION: ${{ secrets.SEAT_AERO_SESSION }}
        run: ./.github/scripts/fetch-pnpz.sh PZ PNPZ_Data_PZ.csv

      # PN (Premium Plus upgrade space) is a bonus column in the Hub Scan view.
      # Not every account can pull it, so a failure here must not cost us the
      # PZ refresh that just succeeded.
      - name: Download PN CSV from Seat Aero
        continue-on-error: true
        env:
          SEAT_AERO_SESSION: ${{ secrets.SEAT_AERO_SESSION }}
        run: ./.github/scripts/fetch-pnpz.sh PN PNPZ_Data_PN.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- PNPZ_Data_PZ.csv
          if [ -f PNPZ_Data_PN.csv ]; then
            git add -- PNPZ_Data_PN.csv
          fi
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update PNPZ data $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            git push
          fi
