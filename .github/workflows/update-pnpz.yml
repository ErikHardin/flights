name: Update PNPZ Data

on:
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch PNPZ data
        env:
          SEATS_BEARER_TOKEN: ${{ secrets.SEATS_BEARER_TOKEN }}
        run: |
          python3 << 'EOF'
          import urllib.request, os
          token = os.environ["SEATS_BEARER_TOKEN"]
          all_rows = []
          header = None
          for fare in ["PZ","PN","RN"]:
              url = f"https://seats.aero/_api/pnpz?fare_class={fare}&origin_region=Anywhere&destination_region=Anywhere&csv=true"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "text/csv,*/*", "User-Agent": "Mozilla/5.0", "Referer": "https://seats.aero/pnpz"})
              with urllib.request.urlopen(req) as r:
                  lines = r.read().decode("utf-8").strip().split("\n")
                  if not header: header = lines[0]
                  all_rows.extend(lines[1:])
              print(f"{fare}: {len(lines)-1} rows")
          open("PNPZ_Data_PZ.csv","w").write(header+"\n"+ "\n".join(all_rows))
          EOF

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add PNPZ_Data_PZ.csv
          git diff --staged --quiet || git commit -m "Update PNPZ data"
          git push
